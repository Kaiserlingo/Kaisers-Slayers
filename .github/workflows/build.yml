name: Build Kaiser's Slayers

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Mod bauen + Tests
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Fertige Mod (.jar) hochladen
        uses: actions/upload-artifact@v4
        with:
          name: kaisers-slayers
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      # Neue Version auf main → automatisch ein Release v<mod_version> anlegen (falls es das noch nicht gibt)
      - name: Neue Version auf main?
        id: ver
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release-Notizen (nur der neueste Abschnitt aus CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v') || steps.ver.outputs.new == 'true'
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > release_notes.md
          printf '\n---\n**Installation:** `.jar` unten herunterladen und in den `mods`-Ordner legen (Fabric Loader + Fabric API für Minecraft 26.2 nötig). Ab jetzt meldet sich die Mod im Spiel, wenn es ein Update gibt – ein Klick auf **[UPDATE NOW]** installiert es.\n' >> release_notes.md

      - name: Release erstellen (Tag v… oder neue Version auf main)
        if: startsWith(github.ref, 'refs/tags/v') || steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          body_path: release_notes.md
          name: "Kaiser's Slayers ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}"
