name: Build Kaiser's Slayers

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Mod bauen + Tests
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Fertige Mod (.jar) hochladen
        uses: actions/upload-artifact@v4
        with:
          name: kaisers-slayers
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Release-Notizen (nur der neueste Abschnitt aus CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > release_notes.md
          printf '\n---\n**Installation:** `.jar` unten herunterladen und in den `mods`-Ordner legen (Fabric Loader + Fabric API für Minecraft 26.2 nötig). Ab jetzt meldet sich die Mod im Spiel, wenn es ein Update gibt – ein Klick auf **[UPDATE NOW]** installiert es.\n' >> release_notes.md

      - name: Release erstellen (nur bei Tags wie v1.2.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          body_path: release_notes.md
          name: "Kaiser's Slayers ${{ github.ref_name }}"
