name: Visual Test

on:
  push:
    branches: ["v2-dev"]
  workflow_dispatch:

jobs:
  client-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Gametest-API anzeigen
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava -q || true
          J=$(find ~/.gradle -name "fabric-client-gametest-api-v1*.jar" | grep -v sources | head -1)
          echo "JAR $J"
          for c in $(unzip -l "$J" | grep -o "net/fabricmc/fabric/api/client/gametest/v1/[A-Za-z/]*\.class" | sed 's/\.class//;s#/#.#g'); do javap -cp "$J" "$c"; done
      - name: Spiel starten und Screenshots machen
        run: |
          chmod +x ./gradlew
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --stacktrace
      - name: Screenshots ins Log schreiben
        if: always()
        run: |
          find . -path ./.gradle -prune -o -name "*.png" -path "*screenshots*" -print | sort | while read f; do
            echo "===SHOT_BEGIN $(basename "$f")"
            base64 -w 4000 "$f"
            echo "===SHOT_END"
          done
      - name: Spiel-Log
        if: always()
        run: |
          find . -path ./.gradle -prune -o -name "latest.log" -print | while read f; do echo "== $f"; grep -iE "error|exception|kaiser|mixin" "$f" | head -80; done
