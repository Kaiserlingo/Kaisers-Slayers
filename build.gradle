plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom fügt Minecraft- und Fabric-Repositories automatisch hinzu.
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Tests (nur zum Prüfen der Logik, nicht in der Mod enthalten)
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

// Automatische Client-Tests: startet das echte Spiel und macht Screenshots (./gradlew runClientGameTest)
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "kaisers_slayers_test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_kaisers-slayers" }
	}
}
tasks.register('inspectApi') {
	notCompatibleWithConfigurationCache("inspect only")
	doLast {
		def files = sourceSets.main.compileClasspath.files
		def cp = files.join(File.pathSeparator)
		def found = []
		files.findAll { it.name.endsWith('.jar') }.each { jar ->
			new java.util.zip.ZipFile(jar).withCloseable { z ->
				z.entries().each { e ->
					if (e.name.endsWith('.class') && (e.name ==~ '.*(FontDescription|chat.Style|gui.Font|StringSplitter).*') && !e.name.contains('lambda')) found << e.name.replace('/', '.').replace('.class', '')
				}
			}
		}
		println "GIZMO CLASSES: " + found
		(file('inspect-classes.txt').readLines().findAll { it.trim() } + found).unique().each { c ->
			def sout = new StringBuilder(), serr = new StringBuilder()
			def p = ['javap', '-p', '-cp', cp, c].execute()
			p.waitForProcessOutput(sout, serr)
			println "===== ${c}"
			println sout
			if (serr) println "ERR: ${serr}"
		}
	}
}
